name: Daily reminder

on:
  schedule:
    # 13:00 UTC. GitHub runs cron in UTC only, so pick the UTC time that lands
    # on her morning and change this line — e.g. 9am US Eastern is 13:00 UTC in
    # summer and 14:00 UTC once the clocks go back, 9am UK is 08:00 UTC, 9am
    # India is 03:30 UTC. Scheduled runs can drift by several minutes under
    # load, which is fine for a daily nudge.
    - cron: '0 13 * * *'
  # Lets you fire one on demand to test the whole path.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Send today's email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          APP_URL: ${{ vars.APP_URL }}
          REMINDER_TZ: ${{ vars.REMINDER_TZ }}
          FROM_NAME: ${{ vars.FROM_NAME }}
        run: npx tsx scripts/send-reminder.ts

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, which would silently end the reminders mid-season. A commit on
  # the first of each month keeps the repository active without filling the
  # history with daily noise.
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Touch the heartbeat on the 1st
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Not the 1st — nothing to do."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-active
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active
          git commit -m "Keep scheduled workflows alive" || exit 0
          git push
